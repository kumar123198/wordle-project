<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-card">
    <h1>Wordle Game</h1>
    <p class="instructions">Guess the hidden 5-letter word in 6 tries.</p>

    <div id="board" class="board" aria-label="Guess board"></div>

    <form id="guess-form" class="guess-form">
      <label class="sr-only" for="guess-input">Your 5-letter guess</label>
      <input id="guess-input" type="text" maxlength="5" autocomplete="off"
        placeholder="Enter a word" aria-describedby="message">
      <button id="submit-button" type="submit">Submit Guess</button>
    </form>
    <p id="message" class="message" aria-live="polite">Good luck!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
